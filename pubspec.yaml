name: noor_quran_app
description: A comprehensive Islamic app for Quran, Prayer Times, Athkar, and Qibla.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  adhan: ^2.0.0
  quran: any
  hijri: ^3.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_qiblah: ^2.2.1
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  audioplayers: ^5.2.1
  intl: ^0.18.1
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
